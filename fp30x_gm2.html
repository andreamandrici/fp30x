        button:hover { background: #f39c12; }
        button:active { transform: scale(0.98); }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #888; padding: 8px; background: #1e1e1e; border-radius: 4px; }

</head>

    </div>
    
    <label for="midiOutputs">1. Porta Output Roland (Bluetooth o USB):</label>

    <label for="categorySelect">2. Categoria Strumenti (Chart Ufficiale):</label>

let midiAccess = null;
let activeOutput = null;

if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(onMIDISuccess, () => updateStatus("⚠️ Accesso MIDI negato dal browser."));
} else {
    updateStatus("❌ Questo browser non supporta le Web MIDI API.");
}

function onMIDISuccess(access) {
    midiAccess = access;
    const outputsSelect = document.getElementById("midiOutputs");
    outputsSelect.innerHTML = "";
    
    const outputs = Array.from(midiAccess.outputs.values());
    if (outputs.length === 0) {
        outputsSelect.innerHTML = "<option>Nessun hardware rilevato</option>";
        updateStatus("⚠️ Connetti l'FP-30X tramite cavo USB o Bluetooth MIDI.");
        return;
    }

    outputs.forEach((out) => {
        let opt = document.createElement("option");
        opt.value = out.id;
        opt.textContent = out.name;
        outputsSelect.appendChild(opt);
    });
    
    activeOutput = outputs[0];
    outputsSelect.onchange = (e) => activeOutput = midiAccess.outputs.get(e.target.value);
    
    setupCategories();
    updateStatus("Piano connesso e pronto.");
}

function setupCategories() {
    const catSelect = document.getElementById("categorySelect");
    catSelect.innerHTML = "";
    for (let cat in fp30xDataset) {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
    }
    updateInstruments();
}

function updateInstruments() {
    const cat = document.getElementById("categorySelect").value;
    const instSelect = document.getElementById("instrumentSelect");
    instSelect.innerHTML = "";
    
    fp30xDataset[cat].forEach((inst) => {
        let opt = document.createElement("option");
        opt.value = JSON.stringify(inst);
        opt.textContent = `${inst.name} [MSB:${inst.msb} LSB:${inst.lsb} PC:${inst.pc}]`;
        instSelect.appendChild(opt);
    });
}

function sendInstrumentChange() {
    if (!activeOutput) { alert("Scegli la porta MIDI dell'FP-30X!"); return; }
    
    const instData = JSON.parse(document.getElementById("instrumentSelect").value);
    
    // REGOLA MANDATORIA ROLAND FP-30X DESTRATTA DALLA MIDI CHART:
    // Canale 4 (indice logico 3) per far sì che la tastiera fisica cambi suono sotto le mani.
    const channel = 3; 
    
    const ccStatus = 0xB0 | channel;
    const pcStatus = 0xC0 | channel;
    const now = window.performance.now();

    // Sincronizzazione a pacchetti temporizzati obbligatoria per processori Roland
    activeOutput.send([ccStatus, 0, instData.msb], now);          // Bank Select MSB
    activeOutput.send([ccStatus, 32, instData.lsb], now + 7);     // Bank Select LSB (+7ms delay)
    activeOutput.send([pcStatus, instData.pc], now + 14);         // Program Change (+14ms delay)

    updateStatus(`Inviato a FP-30X Ch4 ➔ MSB:${instData.msb} LSB:${instData.lsb} PC:${instData.pc}`);
}

function updateStatus(msg) { document.getElementById("statusLog").textContent = msg; }
</script>
