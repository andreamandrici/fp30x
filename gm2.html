    </style>
</head>
<body>

	{"name": "Standard Kit", "msb": 120, "lsb": 0, "pc": 0},
	{"name": "Room Kit", "msb": 120, "lsb": 0, "pc": 8},
	{"name": "Power Kit", "msb": 120, "lsb": 0, "pc": 16},
	{"name": "Electronic Kit", "msb": 120, "lsb": 0, "pc": 24},
	{"name": "Analog Kit (TR-808)", "msb": 120, "lsb": 0, "pc": 25},
	{"name": "Jazz Kit", "msb": 120, "lsb": 0, "pc": 32},
	{"name": "Brush Kit", "msb": 120, "lsb": 0, "pc": 40},
	{"name": "Orchestra Kit", "msb": 120, "lsb": 0, "pc": 48},
	{"name": "Sound FX Kit", "msb": 120, "lsb": 0, "pc": 57}
  ]
}
;

let midiAccess = null;
let activeOutput = null;

// Inizializza le Web MIDI API
if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(onMIDISuccess, () => updateStatus("Accesso MIDI negato."));
} else {
    updateStatus("Il tuo browser non supporta le Web MIDI API.");
}

function onMIDISuccess(access) {
    midiAccess = access;
    const outputsSelect = document.getElementById("midiOutputs");
    outputsSelect.innerHTML = "";
    
    const outputs = Array.from(midiAccess.outputs.values());
    if (outputs.length === 0) {
        outputsSelect.innerHTML = "<option>Nessun hardware rilevato</option>";
        updateStatus("Collega un sintetizzatore virtuale o hardware.");
        return;
    }

    outputs.forEach((out, index) => {
        let opt = document.createElement("option");
        opt.value = out.id;
        opt.textContent = out.name;
        outputsSelect.appendChild(opt);
    });
    
    activeOutput = outputs[0];
    outputsSelect.onchange = (e) => activeOutput = midiAccess.outputs.get(e.target.value);
    
    setupCategories();
    updateStatus("Dispositivo pronto.");
}

function setupCategories() {
    const catSelect = document.getElementById("categorySelect");
    for (let cat in gm2Dataset) {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
    }
    updateInstruments();
}

function updateInstruments() {
    const cat = document.getElementById("categorySelect").value;
    const instSelect = document.getElementById("instrumentSelect");
    instSelect.innerHTML = "";
    
    gm2Dataset[cat].forEach((inst, index) => {
        let opt = document.createElement("option");
        opt.value = JSON.stringify(inst);
        opt.textContent = `${inst.name} [MSB:${inst.msb} LSB:${inst.lsb} PC:${inst.pc}]`;
        instSelect.appendChild(opt);
    });
}

function sendInstrumentChange() {
    if (!activeOutput) { alert("Nessun output MIDI selezionato!"); return; }
    
    const instData = JSON.parse(document.getElementById("instrumentSelect").value);
    
    // Per i Drum Kit usiamo solitamente il Canale 10 (indice 9), per gli altri il Canale 1 (indice 0)
    const channel = (instData.msb === 120) ? 9 : 0;
    
    const ccStatus = 0xB0 | channel;
    const pcStatus = 0xC0 | channel;

    // Sequenza temporizzata per evitare sovrapposizioni nei buffer hardware
    activeOutput.send([ccStatus, 0, instData.msb]);   // CC 0
    activeOutput.send([ccStatus, 32, instData.lsb]);  // CC 32
    activeOutput.send([pcStatus, instData.pc]);       // Program Change

    updateStatus(`Inviato: ${instData.name} su Ch ${channel+1}`);
}

function updateStatus(msg) { document.getElementById("statusLog").textContent = msg; }
</script>

</html>
