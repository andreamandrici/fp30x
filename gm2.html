<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Selettore Strumenti GM2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e24; color: #fff; padding: 20px; }
        .container { max-width: 500px; background: #2a2a35; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin: 0 auto; }
        h2 { text-align: center; color: #4dadf7; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #ccc; }
        select, button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #3b3b4f; color: white; font-size: 16px; box-sizing: border-box; }
        select:focus { outline: 2px solid #4dadf7; }
        button { background: #4dadf7; color: #1e1e24; font-weight: bold; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #339af0; }
        .status { text-align: center; margin-top: 15px; font-size: 14px; color: #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Selettore GM2 MIDI</h2>
    
    <label for="midiOutputs">1. Dispositivo di Output MIDI:</label>
    <select id="midiOutputs"><option>Inizializzazione in corso...</option></select>

    <label for="categorySelect">2. Famiglia Strumenti:</label>
    <select id="categorySelect" onchange="updateInstruments()"></select>

    <label for="instrumentSelect">3. Strumento Specifico (Variante GM2):</label>
    <select id="instrumentSelect"></select>

    <button onclick="sendInstrumentChange()">Invia Cambio Strumento</button>
    <div id="statusLog" class="status">Consenti l'accesso al MIDI se richiesto.</div>
</div>

<script>

// Dichiarazione iniziale vuota
let gm2Dataset = {};

// Esegui la richiesta asincrona per leggere il database esterno
fetch('./fp30x_complete_instruments.json')
  .then(response => {
    if (!response.ok) throw new Error("Risposta di rete non valida");
    return response.json();
  })
  .then(data => {
    gm2Dataset = data;
    console.log("Database strumenti caricato con successo!");
    
    // Se le Web MIDI API si sono già inizializzate, popola subito i menu grafici
    if (midiAccess) setupCategories();
  })
  .catch(error => console.error("Errore nel caricamento del file JSON:", error));	
	
let midiAccess = null;
let activeOutput = null;

// Inizializza le Web MIDI API
if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(onMIDISuccess, () => updateStatus("Accesso MIDI negato."));
} else {
    updateStatus("Il tuo browser non supporta le Web MIDI API.");
}

function onMIDISuccess(access) {
    midiAccess = access;
    const outputsSelect = document.getElementById("midiOutputs");
    outputsSelect.innerHTML = "";
    
    const outputs = Array.from(midiAccess.outputs.values());
    if (outputs.length === 0) {
        outputsSelect.innerHTML = "<option>Nessun hardware rilevato</option>";
        updateStatus("Collega un sintetizzatore virtuale o hardware.");
        return;
    }

    outputs.forEach((out, index) => {
        let opt = document.createElement("option");
        opt.value = out.id;
        opt.textContent = out.name;
        outputsSelect.appendChild(opt);
    });
    
    activeOutput = outputs[0];
    outputsSelect.onchange = (e) => activeOutput = midiAccess.outputs.get(e.target.value);
    
    setupCategories();
    updateStatus("Dispositivo pronto.");
}

function setupCategories() {
    const catSelect = document.getElementById("categorySelect");
    for (let cat in gm2Dataset) {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
    }
    updateInstruments();
}

function updateInstruments() {
    const cat = document.getElementById("categorySelect").value;
    const instSelect = document.getElementById("instrumentSelect");
    instSelect.innerHTML = "";
    
    gm2Dataset[cat].forEach((inst, index) => {
        let opt = document.createElement("option");
        opt.value = JSON.stringify(inst);
        opt.textContent = `${inst.name} [MSB:${inst.msb} LSB:${inst.lsb} PC:${inst.pc}]`;
        instSelect.appendChild(opt);
    });
}

function sendInstrumentChange() {
    if (!activeOutput) { alert("Nessun output MIDI selezionato!"); return; }
    
    const instData = JSON.parse(document.getElementById("instrumentSelect").value);
    
    // FORZATURA PER ROLAND FP-30X: 
    // Canale 4 (indice 3) per i suoni melodici, Canale 10 (indice 9) per la batteria
    const channel = (instData.msb === 120) ? 9 : 3; 
    
    const ccStatus = 0xB0 | channel;
    const pcStatus = 0xC0 | channel;
    const now = window.performance.now();

    // Invio con micro-delay temporizzato per stabilità hardware
    activeOutput.send([ccStatus, 0, instData.msb], now);
    activeOutput.send([ccStatus, 32, instData.lsb], now + 5);
    activeOutput.send([pcStatus, instData.pc], now + 10);

    updateStatus(`Inviato a FP-30X: ${instData.name} su Canale MIDI ${channel + 1}`);
}

function updateStatus(msg) { document.getElementById("statusLog").textContent = msg; }
</script>
</body>
</html>
